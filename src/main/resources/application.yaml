spring:
  application:
    name: meshgroup-test-assg

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_assg}
    username: ${DB_USERNAME:test_assg}
    password: ${DB_PASSWORD:test_assg}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  liquibase:
    enabled: true
    change-log: "classpath:/db/changelog/db.changelog-master.xml"

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2s
    connect-timeout: 2s
logging:
  pattern:
    level: "%5p [req=%X{requestId:-}] [user=%X{userId:-}]"

app:
  jwt:
    secret: "web.servletapi.SecurityContextHolderAwareRequestFilter@674d2b8b, org.springframework.security.web.authentication.AnonymousAuthenticationFilter@4c57ca10"
    expiration-ms: 2592000000 # 30 days
  balance:
    growth-rate: 1.10
    max-multiplier: 2.07
  cache:
    users-ttl: 10m
    user-search-ttl: 1m