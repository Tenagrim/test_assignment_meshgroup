services:
  postgres:
    image: postgres:17-alpine
    container_name: test_assg
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_assg
      POSTGRES_USER: test_assg
      POSTGRES_PASSWORD: test_assg
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_assg -d test_assg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: test_assg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: