services:
  postgres:
#    image: postgres:17-alpine
    build: loadtest/postgres
    container_name: test_assg
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_assg
      POSTGRES_USER: test_assg
      POSTGRES_PASSWORD: test_assg
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./loadtest/postgres/init-dbezium.sql:/docker-entrypoint-initdb.d/init-debezium.sql:ro
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_assg -d test_assg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: test_assg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0  # или confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"    # для доступа с хоста
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1 # защита от переполнения при нетабильной работе сервиса уведомлений. Допустим, уведомления старше часа становятся неактуальными, их можно отбросить

  connect-init:
    image: curlimages/curl:latest
    depends_on:
      - connect
    volumes:
      - ./loadtest/dbezium/register-postgres.json:/register-postgres.json:ro
    entrypoint: >
      sh -c "
      echo 'Ожидание Kafka Connect...';
      until curl -s -o /dev/null -w '%{http_code}' http://connect:8083/connectors | grep -q 200; do
        echo 'Connect не готов, ждём...';
        sleep 3;
      done;
      echo 'Connect готов, регистрируем коннектор...';
      curl -s -X PUT -H 'Content-Type: application/json' --data @/register-postgres.json http://connect:8083/connectors/outbox-connector/config;
      echo 'Готово';
      "
    restart: "no"

  connect:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock-notify
    ports:
      - "8089:8080"
    volumes:
      - ./loadtest/wiremock:/home/wiremock
    command:
      - "--async-response-enabled=true"
      - "--no-request-journal"
      - "--container-threads=50"
      - "--global-response-templating"


volumes:
  postgres-data: